<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0d0a14;--bg2:#161120;--text:#f3eef8;--muted:#a79fb5;--accent:#ff4d12;--accent2:#ff8a3d;--card:#1a1426;--line:#2c2340;--btn-text:#fff}
:root[data-theme="blush"]{--bg:#fff5f0;--bg2:#ffe9ee;--text:#2a1a22;--muted:#7a6670;--accent:#e8386d;--accent2:#ff7aa2;--card:#ffffff;--line:#f3c9d4}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,sans-serif;line-height:1.6;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{font-weight:800;font-size:1.3rem}.logo b{color:var(--accent)}
.links{display:flex;align-items:center;gap:22px;font-size:.92rem}
.links a:hover{color:var(--accent)}
.btn{display:inline-block;border:1.5px solid var(--accent);background:var(--accent);color:var(--btn-text);padding:9px 20px;border-radius:999px;font:600 .9rem Poppins,sans-serif;cursor:pointer;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent);color:var(--btn-text)}
.toggle{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 12px;font:500 .8rem Poppins;cursor:pointer}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center;min-height:calc(100vh - 64px);padding:40px 0}
.hero{position:relative}.herologo{position:absolute;top:20px;right:16px;width:clamp(72px,11vw,120px);height:auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,.45));z-index:1}
.hero h1{font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.15;margin:0 0 16px;font-weight:800}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--muted);max-width:46ch;margin:0 0 26px}
.cursor{border-right:3px solid var(--accent);padding-right:4px;animation:blink 1s step-end infinite}
@keyframes blink{50%{border-color:transparent}}
.row{display:flex;gap:14px;flex-wrap:wrap}
.photo{justify-self:center;position:relative;width:min(340px,80%);aspect-ratio:4/5;border:3px solid var(--accent);border-radius:32px 90px 32px 90px;overflow:hidden;background:linear-gradient(145deg,var(--bg2),var(--card));box-shadow:0 0 50px color-mix(in srgb,var(--accent) 35%,transparent);cursor:pointer;display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .ph{font-size:5rem;font-weight:800;color:var(--accent)}
.photo img{object-position:center 20%}.about-photo img{object-position:center}.photo .hint{opacity:0;background:rgba(0,0,0,.55);color:#fff;bottom:0;padding:8px;transition:opacity .2s}.photo:hover .hint,.photo:focus-within .hint{opacity:1}
.photo small{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:var(--muted);font-size:.75rem}
section{padding:80px 0}
h2{font-size:2rem;margin:0 0 8px;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 auto 40px;max-width:52ch}
.about{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.about p{color:var(--muted)}
.bars{display:grid;gap:16px}
.bar .top{display:flex;justify-content:space-between;font-weight:500;font-size:.9rem;margin-bottom:6px}
.track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;width:0;transition:width 1s ease}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:150px;display:grid;place-items:center;font-size:2.4rem;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.thumbbtn{border:0;padding:0;width:100%;height:auto;cursor:pointer;display:block;background:var(--bg2)}.thumbbtn img{width:100%;height:auto;display:block;transition:transform .3s}.thumbbtn:hover img{transform:scale(1.03)}.thumbbtn{overflow:hidden}
.card .body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{margin:0;font-size:1.1rem}.card p{margin:0;color:var(--muted);font-size:.88rem;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:.72rem;padding:2px 10px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--accent);font-weight:600}
.svc{padding:26px;text-align:center}.svc .ic{font-size:2rem;color:var(--accent)}
.contact{max-width:560px;margin:0 auto;display:grid;gap:14px}
.contact input,.contact textarea{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.info{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;margin-bottom:28px;color:var(--muted);font-size:.92rem}
footer{border-top:1px solid var(--line);background:var(--bg2);padding:32px 0;text-align:center;color:var(--muted);font-size:.88rem}
footer .row{justify-content:center;margin-bottom:10px}
.facts{margin:20px 0 0;display:grid;gap:10px}.facts div{display:grid;grid-template-columns:90px 1fr;gap:10px;font-size:.92rem}.facts dt{font-weight:600;color:var(--accent)}.facts dd{margin:0;color:var(--muted)}
.about-photo{width:min(300px,80%);justify-self:center}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
.mbox{background:var(--card);border-radius:16px;width:min(1000px,100%);height:min(86vh,100%);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.mbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.mbox iframe{flex:1;border:0;background:#fff;width:100%}
.links a.on{color:var(--accent)}
.burger{display:none;background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;width:40px;height:36px;font-size:1.1rem;cursor:pointer}
.mnav{position:absolute;left:0;right:0;top:64px;background:var(--bg);border-bottom:1px solid var(--line);display:grid;padding:8px 24px 16px}
.mnav a{padding:12px 0;border-bottom:1px solid var(--line);font-weight:500}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:6px 16px;font:500 .88rem Poppins,sans-serif;cursor:pointer}
a.chip:hover,button.chip:hover{border-color:var(--accent);color:var(--accent)}
.totop{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:1.2rem;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.photo:hover{transform:rotate(-1.5deg) scale(1.02)}.photo{transition:transform .3s}
.friends{margin-top:64px;text-align:center}.friends>h3{font-size:1.5rem;margin:0 0 8px}
.fphotos{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}
.fphotos img{width:100%;height:auto;border-radius:18px;border:2px solid var(--accent);display:block}
.school{width:100%;height:auto;border-radius:12px;display:block;margin:0 0 14px}
.cimg{width:100%;height:auto;border-radius:12px;display:block;margin:14px 0 0}.cimg.gym{height:240px;object-fit:cover;object-position:center 60%}
@media(max-width:760px){.fphotos{grid-template-columns:1fr}.burger{display:block}.links .btn.hide{display:none}.links a.hide{display:none}.info{gap:10px}
.hero,.about{grid-template-columns:1fr}.hero{text-align:center}.hero p{margin-inline:auto}.row{justify-content:center}.photo{order:-1;width:min(240px,70%)}.links a.hide{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function useTyped(words) {
  const [i, setI] = useState(0), [txt, setTxt] = useState(""), [del, setDel] = useState(false);
  useEffect(() => {
    const w = words[i % words.length];
    const t = setTimeout(() => {
      if (!del) { setTxt(w.slice(0, txt.length + 1)); if (txt.length + 1 === w.length) setTimeout(() => setDel(true), 1200); }
      else { setTxt(w.slice(0, txt.length - 1)); if (txt.length <= 1) { setDel(false); setI(i + 1); } }
    }, del ? 40 : 80);
    return () => clearTimeout(t);
  }, [txt, del, i]);
  return txt;
}

function SkillBar({ name, pct }) {
  const [w, setW] = useState(0);
  useEffect(() => { const t = setTimeout(() => setW(pct), 200); return () => clearTimeout(t); }, [pct]);
  return (
    <div className="bar">
      <div className="top"><span>{name}</span><span>{pct}%</span></div>
      <div className="track"><div className="fill" style={{ width: w + "%" }} /></div>
    </div>
  );
}
